name: Build data and deploy map

# Rebuilds docs/data from the committed BORIS Hessen extract (data/) plus Landsat summer surface temperature,
# and publishes docs/ to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          pip install -r requirements.txt
          mkdir -p logs input docs/data

      - name: Summer land-surface temperature (Landsat 8/9, Planetary Computer)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python pipeline/build_heat.py --years 2022-2025 2>&1 | tee logs/01_heat.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Zones, CAGR, scenarios, simulation, heat per zone
        run: |
          python pipeline/build_zones.py 2>&1 | tee logs/02_zones.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Summary
        if: always()
        run: |
          ls -lh docs/data | tee logs/03_files.log
          python -c "import json;s=json.load(open('docs/data/stats.json'));print(json.dumps({k:s[k] for k in ('zones','with_2022','with_2024','groups','heat','w_falls')},ensure_ascii=False,indent=1))" > logs/04_stats.log || true
          { echo '```json'; cat logs/04_stats.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report (annotations readable via the API)
        if: always()
        run: |
          python - <<'PY'
          import glob, os
          def note(title, text):
              text = text[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title={title}::{text}")
          for f in sorted(glob.glob("logs/*.log")):
              lines = [l for l in open(f, errors="replace").read().splitlines() if l.strip()]
              note(os.path.basename(f), "\n".join(lines[-40:]))
          PY

      - name: Publish result files to the 'data' branch (for QGIS users)
        continue-on-error: true
        run: |
          mkdir -p /tmp/snap && cd /tmp/snap
          for f in zones_scenarios.gpkg.zip zones_scenarios.csv.zip lst_summer_frankfurt.tif stats.json heat.json heat.png; do
            [ -f "$GITHUB_WORKSPACE/docs/data/$f" ] && cp "$GITHUB_WORKSPACE/docs/data/$f" .
          done
          printf '# Result files\n\nBuilt by the GitHub Action from commit %s on %s.\n' "$GITHUB_SHA" "$(date -u +%F)" > README.md
          git init -q -b data && git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Results of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
